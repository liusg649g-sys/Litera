server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # PDF.js ships an ES module Worker. Nginx 1.28's default MIME map may not
    # include .mjs; module Workers reject application/octet-stream with nosniff.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }
    location /api/ {
        # API enforces the configured file limit, including streamed requests.
        # Leave transport size unlimited here to avoid a mismatched HTML 413.
        client_max_body_size 0;
        proxy_request_buffering off;
        # C1 isolated render has a 60s server deadline before PDF bytes begin.
        proxy_read_timeout 75s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
